<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>HD IPO - Live GMP & Allotment</title>
  <meta name="description" content="HD IPO — Live Mainboard & SME IPO GMP, 3-Year RHP Financials, Business Strength vs Market Demand Analysis & Fast Family PAN Allotment.">
  <meta name="theme-color" content="#1d4ed8">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="HD IPO">
  <link rel="icon" type="image/png" sizes="192x192" href="/pwa-192x192.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.json" crossorigin="use-credentials">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="app-shell">

    <!-- 1. TOP HEADER -->
    <header class="app-header">
      <div class="brand">
        <div class="logo-box">HD</div>
        <div>
          <h1 class="app-title">HD IPO</h1>
          <p class="app-subtitle">Mainboard • SME • Live GMP</p>
        </div>
      </div>
      <div class="header-actions">
        <button id="installBtn" class="install-pill" onclick="triggerInstallApp()" title="Mobile par App Install karein">
          📲 Install
        </button>
        <button id="accountBtn" class="account-pill" onclick="openAuthModal()" title="Login / Profile">
          👤 Login
        </button>
        <button id="syncBtn" class="live-pill" onclick="syncLiveData(true)" style="color:#fff;cursor:pointer;">
          <span class="dot"></span> SYNC
        </button>
      </div>
    </header>

    <!-- 2. SEARCH BAR -->
    <section class="search-section">
      <div class="search-box">
        <svg class="icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <input type="text" id="searchInput" placeholder="Search IPO name (e.g. Tata, Bajaj)...">
      </div>
    </section>

    <!-- 3. CATEGORY FILTER (ALL / MAINBOARD / SME) -->
    <section class="filter-section">
      <button class="chip active" data-category="all">All IPOs</button>
      <button class="chip" data-category="mainboard">Mainboard</button>
      <button class="chip" data-category="sme">SME IPO</button>
    </section>

    <!-- 4. STATUS TABS (LIVE / UPCOMING / CLOSED) -->
    <nav class="tabs-bar">
      <button class="tab-btn active" data-tab="live">Live</button>
      <button class="tab-btn" data-tab="upcoming">Upcoming</button>
      <button class="tab-btn" data-tab="closed">Closed</button>
    </nav>

    <!-- 5. MAIN CONTENT AREA (Yahan Step 3 mein IPO Cards aayenge) -->
    <main id="mainContent" class="main-content">
      <div class="placeholder-card">
        <h3>HD IPO Design Taiyar Hai!</h3>
        <p>Step 3 mein yahan saare Live, Upcoming aur Closed IPO cards dikhai denge.</p>
      </div>
    </main>

    <!-- 6. BOTTOM NAVIGATION BAR -->
    <nav class="bottom-nav">
      <button class="nav-item active" data-page="home">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
          <polyline points="9 22 9 12 15 12 15 22"></polyline>
        </svg>
        <span>Home</span>
      </button>

      <button class="nav-item" data-page="gmp">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="23 6 13.5 15.5 8.5 10.5 1 18"></polyline>
          <polyline points="17 6 23 6 23 12"></polyline>
        </svg>
        <span>GMP</span>
      </button>

      <button class="nav-item" data-page="watchlist">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path>
        </svg>
        <span>Saved</span>
      </button>

      <button class="nav-item" data-page="allotment">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M9 11l3 3L22 4"></path>
          <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"></path>
        </svg>
        <span>Allotment</span>
      </button>

      <button id="adminNavItem" class="nav-item hidden" data-page="admin">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
          <circle cx="9" cy="7" r="4"></circle>
          <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
          <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
        </svg>
        <span>Users</span>
      </button>
    </nav>

  </div>
<!-- ANALYSIS SCREEN MODAL -->
  <div id="analysisModal" class="modal hidden"></div>
  <script type="module" src="/src/hdipo-auth.ts"></script>
  <script src="data.js"></script>
  <script src="app.js"></script>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("/sw.js", { scope: "/" }).catch(() => {});
      });
    }
  </script>
</body>
</html>
